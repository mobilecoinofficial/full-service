[workspace]
resolver = "2"
members = [
    "full-service",
    "mirror",
    "signer",
    "t3/api",
    "t3/connection",
    "validator/api",
    "validator/connection",
    "validator/service",
]
exclude = ["ledger-mob", "mobilecoin"]

[profile.dev]
opt-level = 0

[profile.release]
debug = true
opt-level = 3
rpath = false
lto = false
debug-assertions = false
overflow-checks = false
strip = "symbols"

[patch.crates-io]
# Fork and rename to use "OG" dalek-cryptography with latest dependencies.
bulletproofs-og = { git = "https://github.com/mobilecoinfoundation/bulletproofs.git", rev = "e7ba85f847fd2beaa67448711de60d6dfd6ac052" }

# mbedtls patched to allow certificate verification with a profile
mbedtls = { git = "https://github.com/mobilecoinfoundation/rust-mbedtls.git", rev = "0bddacc981ac782ca2e2f8aa5ffa25ce0e3d8273" }
mbedtls-sys-auto = { git = "https://github.com/mobilecoinfoundation/rust-mbedtls.git", rev = "0bddacc981ac782ca2e2f8aa5ffa25ce0e3d8273" }

# Override lmdb-rkv for a necessary bugfix (see https://github.com/mozilla/lmdb-rs/pull/80)
lmdb-rkv = { git = "https://github.com/mozilla/lmdb-rs", rev = "df1c2f5" }

# curve25519-dalek 5 and rand 0.10 support are not yet published upstream.
schnorrkel = { git = "https://github.com/mobilecoinfoundation/schnorrkel.git", rev = "65300ab0d2efaf7853f6eaa8cf6930116850e30a" }

# Additional rand 0.10 compatibility patches.
merlin = { git = "https://github.com/mobilecoinofficial/merlin.git", rev = "0bf3a40f3bc6a7e1fba59988fc3ed563093c69c5" }

# Patch mc lib for git dependencies in ledger-mob
mc-core = { path = "./mobilecoin/core" }
mc-crypto-digestible = { path = "./mobilecoin/crypto/digestible" }
mc-crypto-hashes = { path = "./mobilecoin/crypto/hashes" }
mc-crypto-keys = { path = "./mobilecoin/crypto/keys" }
mc-crypto-ring-signature = { path = "./mobilecoin/crypto/ring-signature" }
mc-crypto-ring-signature-signer = { path = "./mobilecoin/crypto/ring-signature/signer" }
mc-transaction-core = { path = "./mobilecoin/transaction/core" }
mc-transaction-extra = { path = "./mobilecoin/transaction/extra" }
mc-transaction-signer = { path = "./mobilecoin/transaction/signer" }
mc-transaction-summary = { path = "./mobilecoin/transaction/summary" }
mc-transaction-types = { path = "./mobilecoin/transaction/types" }
mc-util-from-random = { path = "./mobilecoin/util/from-random" }

# patches for updates to the rust-ledger repo that have not yet been merged
ledger-proto = { git = "https://github.com/ryan-sentz/rust-ledger.git", branch = "ryan/everything" }
ledger-lib = { git = "https://github.com/ryan-sentz/rust-ledger.git", branch = "ryan/everything" }
